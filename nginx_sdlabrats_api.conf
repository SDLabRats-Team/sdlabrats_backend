server {
    # LabRats backend on the class server.
    # Copy to /etc/nginx/sites-available/sdlabrats-api, link it into sites-enabled,
    # then run: sudo nginx -t && sudo systemctl reload nginx
    # and: sudo certbot --nginx -d sdlabrats-api.opencodingsociety.com (choose redirect)
    #
    # Based on nginx_flask_8587.conf, with three differences:
    # - server_name is our subdomain
    # - proxy_pass goes to our port, 8429 (docker-compose.yml runs gunicorn on 8429 and publishes it;
    #   the shared OCS Dockerfile is left unchanged)
    # - no CORS headers and no /socket.io/ block. Flask-CORS in __init__.py already answers
    #   preflight requests and sets Access-Control-Allow-Origin for *.opencodingsociety.com.
    #   Adding the same headers here would send them twice, and browsers reject that.

    listen 80;
    listen [::]:80;
    server_name sdlabrats-api.opencodingsociety.com;

    # Page images and admin uploads (the limit in __init__.py is 5 MB)
    client_max_body_size 6M;

    location / {
        proxy_pass http://localhost:8429;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
